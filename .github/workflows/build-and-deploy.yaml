name: "Build and Deploy"
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: debian-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Build the project
        run: npm run build